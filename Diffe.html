<!DOCTYPE html>
<html>
<head>
<title> DH</title>
</head>
<body>

<h2> dh exchange </h2>

<script>

let p=parseInt(prompt("enter prime no:"));


let g=parseInt(prompt("enter gen no:"));

let a =parseInt(prompt("enter priv key A:"));
let b =parseInt(prompt("enter priv key B:"));

let A=Math.pow(g,a) % p;

let B=Math.pow(g,b) % p;

let sharedkeyA=Math.pow(B,a) % p;

let sharedkeyB=Math.pow(A,b) % p;

document.write("prime no p: " + p + "<br>");
document.write("gen no: " + g + "<br>");
document.write("sharedkeyA: " + sharedkeyA + "<br>");
document.write("sharedkeyA: " + sharedkeyB + "<br>");





</script>
</body>
</html>
